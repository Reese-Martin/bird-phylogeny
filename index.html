<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <style>html{background:#f6f4ef}html[data-theme="dark"]{background:#17191c}</style>
    <script>
      (() => {
        let preference = 'system';
        try { const saved = localStorage.getItem('birds-and-trees-theme'); if (saved === 'light' || saved === 'dark') preference = saved; } catch {}
        let systemDark = false;
        try { systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch {}
        const theme = preference === 'system' ? systemDark ? 'dark' : 'light' : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#17191c' : '#f6f4ef');
      })();
    </script>
    <meta name="description" content="Explore the birds you have recorded on the complete dated tree of birds. Your eBird export stays on your device." />
    <title>phyloBirds — your birds, connected</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
